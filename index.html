<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>GoFoods · Gestão de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
:root{
  /* ---- GoFoods design tokens ---- */
  --bg: #FAF8F5;
  --surface: #FFFFFF;
  --surface-2: #F4F1EC;
  --line: #EAE5DC;
  --ink: #23201C;
  --ink-soft: #736C62;
  --ink-faint: #A69E92;

  --primary: #E8461F;
  --primary-dark: #B93412;
  --primary-soft: #FCE7DE;
  --primary-softer: #FDF3EE;

  --accent: #7C5CFC;
  --accent-soft: #EEE9FF;

  --y-pending: #C88A00;
  --y-pending-bg: #FCF1D6;
  --b-prep: #2563EB;
  --b-prep-bg: #E3ECFE;
  --p-ready: #8B2FD8;
  --p-ready-bg: #F1E3FC;
  --g-delivered: #1E9E5A;
  --g-delivered-bg: #DEF5E9;
  --r-cancel: #D8291F;
  --r-cancel-bg: #FBE2DF;
  --k-notpicked: #4B4640;
  --k-notpicked-bg: #E8E4DC;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --shadow-sm: 0 1px 2px rgba(35,32,28,0.06), 0 1px 1px rgba(35,32,28,0.04);
  --shadow-md: 0 8px 24px rgba(35,32,28,0.08);
  --shadow-lg: 0 20px 48px rgba(35,32,28,0.14);

  --font-display: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --sidebar-w: 264px;
  --topbar-h: 72px;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--primary-soft);color:var(--primary-dark);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:8px;}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:40;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 22px 18px 22px;
}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),#FF7A45);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;
  box-shadow:0 6px 14px rgba(232,70,31,0.35);
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text strong{font-family:var(--font-display);font-weight:800;font-size:15.5px;}
.brand-text span{font-size:11.5px;color:var(--ink-soft);font-weight:500;}

.sidebar-nav{flex:1;overflow-y:auto;padding:6px 14px;}
.nav-section-label{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);padding:16px 12px 8px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;margin-bottom:2px;border-radius:12px;
  color:var(--ink-soft);font-weight:600;font-size:14px;
  cursor:pointer;position:relative;
  transition:background .15s ease,color .15s ease;
}
.nav-item .nav-ic{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;border-radius:8px;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--primary-softer);color:var(--primary-dark);}
.nav-item.active .nav-ic{background:var(--primary);color:#fff;}
.nav-badge{
  margin-left:auto;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;
  border-radius:20px;padding:1px 7px;min-width:18px;text-align:center;
}
.sidebar-foot{padding:14px 20px 20px;border-top:1px solid var(--line);}
.role-switch{
  display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;
}
.role-switch button{
  flex:1;border:none;background:transparent;padding:8px 6px;border-radius:9px;
  font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
}
.role-switch button.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(35,32,28,.4);z-index:35;
}

.main{
  flex:1;
  margin-left:var(--sidebar-w);
  min-width:0;
  display:flex;flex-direction:column;
}

.topbar{
  height:var(--topbar-h);
  background:rgba(250,248,245,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;
  padding:0 28px;
  position:sticky;top:0;z-index:30;
}
.hamburger{
  display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.topbar-title{display:flex;flex-direction:column;margin-right:auto;}
.topbar-title h1{font-size:19px;font-weight:800;}
.topbar-title span{font-size:12.5px;color:var(--ink-soft);font-weight:500;}

.search-box{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border-radius:12px;padding:9px 14px;width:260px;color:var(--ink-soft);
}
.search-box input{border:none;background:transparent;outline:none;font-size:13.5px;width:100%;color:var(--ink);}

.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;
  transition:background .15s ease,transform .1s ease;
}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn:active{transform:scale(.94);}
.icon-dot{
  position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--primary);border:2px solid var(--surface);
}
.profile-chip{
  display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
}
.avatar{
  width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#B79CFF);
  color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;
}
.profile-chip .p-name{font-size:12.5px;font-weight:700;line-height:1.2;}
.profile-chip .p-role{font-size:10.5px;color:var(--ink-soft);font-weight:500;}

.view{padding:26px 28px 60px;}
.view-hidden{display:none;}

/* ---------- login screen ---------- */
.login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(232,70,31,0.08), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(124,92,252,0.08), transparent 45%),
    var(--bg);
  padding:24px;
}
.login-card{
  width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:32px 30px; box-shadow:var(--shadow-md);
}
.login-brand{display:flex;align-items:center;gap:12px;}

/* ---------- generic layout helpers ---------- */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.view-head h2{font-size:23px;font-weight:800;}
.view-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
.row{display:flex;gap:12px;align-items:center;}
.grow{flex:1;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:700;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(232,70,31,.28);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-soft{background:var(--primary-softer);color:var(--primary-dark);}
.btn-soft:hover{background:var(--primary-soft);}
.btn-danger{background:var(--r-cancel-bg);color:var(--r-cancel);}
.btn-danger:hover{background:#f7d1cc;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* filter pills */
.pill-group{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;}
.pill-group button{
  border:none;background:transparent;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
}
.pill-group button.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px 18px 16px;position:relative;overflow:hidden;
}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.kpi-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.kpi-trend{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;}
.kpi-trend.up{color:var(--g-delivered);background:var(--g-delivered-bg);}
.kpi-trend.down{color:var(--r-cancel);background:var(--r-cancel-bg);}
.kpi-value{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1;margin-bottom:6px;}
.kpi-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}

/* ---------- panels / charts ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:20px;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.panel-head h3{font-size:15px;font-weight:800;}
.panel-head .p-tag{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;}
.charts-grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:280px;}

.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{display:flex;align-items:center;gap:10px;}
.rank-num{
  width:22px;height:22px;border-radius:7px;background:var(--surface-2);color:var(--ink-soft);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.rank-info{flex:1;min-width:0;}
.rank-info .r-name{font-size:13px;font-weight:700;}
.rank-bar-bg{height:6px;border-radius:6px;background:var(--surface-2);margin-top:5px;overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),#FF7A45);}
.rank-count{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}

/* ---------- badges / status ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge-pending{background:var(--y-pending-bg);color:var(--y-pending);}
.badge-pending .dot{background:var(--y-pending);}
.badge-prep{background:var(--b-prep-bg);color:var(--b-prep);}
.badge-prep .dot{background:var(--b-prep);}
.badge-ready{background:var(--p-ready-bg);color:var(--p-ready);}
.badge-ready .dot{background:var(--p-ready);}
.badge-delivered{background:var(--g-delivered-bg);color:var(--g-delivered);}
.badge-delivered .dot{background:var(--g-delivered);}
.badge-cancelled{background:var(--r-cancel-bg);color:var(--r-cancel);}
.badge-cancelled .dot{background:var(--r-cancel);}
.badge-notpicked{background:var(--k-notpicked-bg);color:var(--k-notpicked);}
.badge-notpicked .dot{background:var(--k-notpicked);}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--surface);}
table.data-table{width:100%;border-collapse:collapse;min-width:760px;}
.data-table thead th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-faint);padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0;
}
.data-table tbody td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr{cursor:pointer;transition:background .12s ease;}
.data-table tbody tr:hover{background:var(--primary-softer);}
.cell-id{font-family:var(--font-mono);font-weight:700;color:var(--primary-dark);}
.cell-sub{font-size:11.5px;color:var(--ink-soft);}
.cell-strong{font-weight:700;}
.status-select{
  border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;
  background:var(--surface);cursor:pointer;
}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.field-inline{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;font-size:13px;}
.field-inline select,.field-inline input{border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);}

.pagination{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:14px 16px;}
.pg-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-soft);
}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.form-field input,.form-field select,.form-field textarea{
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--ink);
  background:var(--surface);outline:none;transition:border-color .15s ease, box-shadow .15s ease;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);
}
.form-field textarea{resize:vertical;min-height:76px;}
.form-hint{font-size:11.5px;color:var(--ink-faint);}
.form-error{font-size:11.5px;color:var(--r-cancel);}
.form-field.invalid input,.form-field.invalid select,.form-field.invalid textarea{border-color:var(--r-cancel);}

.item-picker-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px;}
.order-items-box{border:1px dashed var(--line);border-radius:14px;padding:12px;background:var(--surface-2);}
.order-line{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:13px;}
.order-line + .order-line{border-top:1px solid var(--line);}
.order-total-row{display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:2px solid var(--line);
  font-weight:800;font-size:15px;}

/* success screen */
.success-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:60px 20px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--line);
}
.success-badge{
  width:72px;height:72px;border-radius:50%;background:var(--g-delivered-bg);color:var(--g-delivered);
  display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:18px;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.order-id-chip{
  font-family:var(--font-mono);font-weight:700;background:var(--primary-softer);color:var(--primary-dark);
  padding:6px 14px;border-radius:30px;font-size:14px;margin:12px 0 20px;
}

/* ---------- product / employee cards ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.prod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;position:relative;}
.prod-cat{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:var(--primary-dark);background:var(--primary-softer);padding:3px 9px;border-radius:8px;margin-bottom:10px;
}
.prod-name{font-size:15px;font-weight:800;margin-bottom:4px;}
.prod-desc{font-size:12px;color:var(--ink-soft);margin-bottom:12px;min-height:30px;}
.prod-foot{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-family:var(--font-mono);font-weight:700;font-size:15px;}
.prod-stock{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.avail-toggle{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;cursor:pointer;
}
.switch{width:34px;height:19px;border-radius:20px;background:var(--surface-2);position:relative;transition:background .15s ease;flex-shrink:0;}
.switch.on{background:var(--g-delivered);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{transform:translateX(15px);}
.prod-actions{display:flex;gap:6px;margin-top:12px;}
.prod-actions .btn{flex:1;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(35,32,28,.5);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:var(--surface);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:slideUp .22s cubic-bezier(.2,.9,.3,1);
}
.modal-box.wide{max-width:700px;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:17px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:9px;border:none;background:var(--surface-2);cursor:pointer;font-size:15px;color:var(--ink-soft);}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}

/* ---------- timeline ---------- */
.timeline{display:flex;align-items:flex-start;justify-content:space-between;margin:8px 0 20px;position:relative;}
.timeline::before{content:'';position:absolute;top:15px;left:6%;right:6%;height:3px;background:var(--line);border-radius:3px;}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;z-index:1;}
.tl-dot{width:32px;height:32px;border-radius:50%;background:var(--surface);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-faint);}
.tl-step.done .tl-dot{border-color:var(--g-delivered);background:var(--g-delivered);color:#fff;}
.tl-step.current .tl-dot{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary-soft);}
.tl-label{font-size:11px;font-weight:700;text-align:center;color:var(--ink-soft);}
.tl-step.done .tl-label,.tl-step.current .tl-label{color:var(--ink);}
.tl-time{font-size:10px;color:var(--ink-faint);}

.audit-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.audit-item:last-child{border-bottom:none;}
.audit-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;}
.audit-text{font-size:13px;line-height:1.5;}
.audit-time{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* ---------- notifications panel ---------- */
.notif-item{display:flex;gap:12px;padding:14px;border-radius:14px;transition:background .12s ease;cursor:pointer;}
.notif-item:hover{background:var(--surface-2);}
.notif-item.unread{background:var(--primary-softer);}
.notif-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;border:1px solid var(--line);}
.notif-title{font-size:13px;font-weight:700;}
.notif-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.notif-time{font-size:10.5px;color:var(--ink-faint);margin-top:4px;}
.notif-dropdown{
  position:absolute;top:56px;right:28px;width:340px;max-height:420px;overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:60;padding:10px;
}

/* ---------- empty states ---------- */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:50px 20px;color:var(--ink-soft);}
.empty-ic{font-size:38px;margin-bottom:12px;opacity:.7;}
.empty-title{font-weight:700;color:var(--ink);margin-bottom:4px;}
.empty-sub{font-size:12.5px;max-width:320px;}

/* ---------- toasts ---------- */
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
.toast{
  background:var(--ink);color:#fff;padding:13px 18px;border-radius:13px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:toastIn .25s cubic-bezier(.2,.9,.3,1);
  max-width:340px;
}
.toast.success{background:#1b3325;}
.toast.error{background:#3a1613;}
@keyframes toastIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ---------- skeleton ---------- */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,#EFEBE3 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ---------- colaborador simple view ---------- */
.colab-hero{
  background:linear-gradient(135deg,var(--primary),#FF7A45);border-radius:24px;padding:26px 24px;color:#fff;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.colab-hero h2{color:#fff;font-size:21px;}
.colab-hero p{color:rgba(255,255,255,.88);font-size:13px;margin-top:6px;}
.colab-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.colab-tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 16px;text-align:center;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
}
.colab-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.colab-tile .c-ic{font-size:30px;margin-bottom:10px;}
.colab-tile .c-label{font-weight:800;font-size:13.5px;}
.colab-order-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;margin-bottom:10px;}

/* ---------- tooltip ---------- */
[data-tip]{position:relative;}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;
  white-space:nowrap;z-index:80;box-shadow:var(--shadow-md);
}

/* ---------- confirm dialog ---------- */
.confirm-ic{width:52px;height:52px;border-radius:16px;background:var(--r-cancel-bg);color:var(--r-cancel);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;}

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  .charts-grid{grid-template-columns:1fr;}
  .charts-grid2{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media (max-width: 900px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .charts-grid2{grid-template-columns:1fr;}
}
@media (max-width: 620px){
  .topbar{padding:0 16px;gap:10px;}
  .view{padding:18px 16px 48px;}
  .profile-chip .p-name,.profile-chip .p-role{display:none;}
  .profile-chip{padding:6px;}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .notif-dropdown{right:10px;left:10px;width:auto;}
}
</style>

<body>

  <div class="login-card">

<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================================================
   GOFOODS — App de gestão de pedidos de lanches
   Vanilla JS SPA · persistência via window.storage (compartilhada)
   ============================================================ */
window.__GC_BOOT__ = true;

/* ---------------------------------------------------------------
   STORAGE — dados compartilhados entre todos os usuários do app
--------------------------------------------------------------- */
const SKEY = 'gofoods-data-v2'; // versão incrementada para começar com uma base 100% limpa
const IDKEY = 'gofoods-colab-identity-v1'; // identidade pessoal (não compartilhada) de quem usa o modo Colaborador
let DB = null; // { orders, employees, departments, products, categories, notifications, audit, meta }

async function storageLoad(){
  try{
    const res = await window.storage.get(SKEY, true);
    if(res && res.value){ return JSON.parse(res.value); }
  }catch(e){ /* key not found yet */ }
  return null;
}
async function storageSave(){
  try{
    await window.storage.set(SKEY, JSON.stringify(DB), true);
  }catch(e){ console.error('Falha ao salvar dados', e); }
}

/* ---------------------------------------------------------------
   CONSTANTES
--------------------------------------------------------------- */
const CATEGORIES = ['Salgados','Sanduíches','Doces','Frutas','Bebidas','Outros'];
const STATUS_FLOW = ['pendente','preparo','pronto','entregue'];
const STATUS_META = {
  pendente:   {label:'Pendente',              emoji:'🟡', cls:'pending'},
  preparo:    {label:'Em preparo',             emoji:'🔵', cls:'prep'},
  pronto:     {label:'Pronto para retirada',   emoji:'🟣', cls:'ready'},
  entregue:   {label:'Entregue',               emoji:'🟢', cls:'delivered'},
  cancelado:  {label:'Cancelado',              emoji:'🔴', cls:'cancelled'},
  nao_retirado:{label:'Não retirado',          emoji:'⚫', cls:'notpicked'},
};
const PAYMENT_METHODS = ['Benefício empresa','Desconto em folha','Dinheiro','Não se aplica'];

const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'🏠'},
  {id:'novo-pedido', label:'Novo Pedido', icon:'🥪'},
  {id:'pedidos', label:'Pedidos', icon:'📋'},
  {id:'cardapio', label:'Cardápio', icon:'🍔'},
  {id:'departamentos', label:'Departamentos', icon:'🏢'},
  {id:'relatorios', label:'Relatórios', icon:'📊'},
  {id:'notificacoes', label:'Notificações', icon:'🔔'},
  {id:'auditoria', label:'Histórico', icon:'🕓'},
  {id:'configuracoes', label:'Configurações', icon:'⚙️'},
];
const COLAB_NAV_ITEMS = [
  {id:'colab-home', label:'Início', icon:'🏠'},
  {id:'colab-pedir', label:'Fazer pedido', icon:'🥪'},
  {id:'colab-meus', label:'Meus pedidos', icon:'📋'},
  {id:'colab-cardapio', label:'Cardápio', icon:'🍔'},
];

let CHARTS = {}; // holds Chart.js instances so we can destroy/rebuild
let currentRole = 'admin'; // 'admin' | 'colab'
let currentRoute = 'dashboard';
let colabIdentity = null; // {name, department} — identidade de quem está usando o modo Colaborador
let dashboardFilter = 'today'; // today | week | month | custom
let dashboardCustomRange = null;
let ordersFilters = {q:'', dept:'', status:'', product:'', from:'', to:'', page:1};
let notifOpen = false;

/* ---------------------------------------------------------------
   UTILS
--------------------------------------------------------------- */
function uid(prefix){
  return prefix + Math.random().toString(36).slice(2,7).toUpperCase();
}
function fmtBRL(v){
  return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtDate(d){
  const dt = (d instanceof Date) ? d : new Date(d+'T00:00:00');
  return dt.toLocaleDateString('pt-BR');
}
function fmtDateTime(iso){
  const dt = new Date(iso);
  return dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function daysAgoStr(n){
  const d = new Date(); d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
function isSameDay(iso, dayStr){ return iso.slice(0,10) === dayStr; }
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  const ic = type==='success' ? '✅' : type==='error' ? '⚠️' : 'ℹ️';
  el.innerHTML = `<span>${ic}</span><span>${escapeHtml(msg)}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease, transform .3s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),300); }, 3200);
}
function pct(n,d){ return d? Math.round((n/d)*100) : 0; }

function departmentName(id){
  const d = DB.departments.find(x=>x.id===id);
  return d ? d.name : '—';
}
function productById(id){ return DB.products.find(p=>p.id===id); }

/* ---------------------------------------------------------------
   SEED DATA — o app inicia vazio, sem exemplos fictícios
--------------------------------------------------------------- */
function buildSeedData(){
  return {
    departments: [],
    employees: [],
    products: [],
    orders: [],
    notifications: [],
    audit: [],
    categories: CATEGORIES,
    meta:{ nextCreated:false }
  };
}

async function initDB(){
  const loaded = await storageLoad();
  if(loaded){ DB = loaded; }
  else{
    DB = buildSeedData();
    await storageSave();
  }
  try{
    const idRes = await window.storage.get(IDKEY, false);
    if(idRes && idRes.value) colabIdentity = JSON.parse(idRes.value);
  }catch(e){ /* no identity saved yet */ }
}
async function saveColabIdentity(){
  try{ await window.storage.set(IDKEY, JSON.stringify(colabIdentity), false); }catch(e){ console.error('Falha ao salvar identidade', e); }
}

function pushAudit(action, orderId){
  DB.audit.unshift({id:uid('AUD-'), user:'Facilities', action, timestamp:new Date().toISOString(), orderId});
}
function pushNotification(type, message){
  DB.notifications.unshift({id:uid('NOT-'), type, message, timestamp:new Date().toISOString(), read:false});
}

/* ---------------------------------------------------------------
   AUTENTICAÇÃO — acesso restrito por usuário/senha compartilhados
--------------------------------------------------------------- */
const AUTHKEY = 'gofoods-auth-v1';
const VALID_USER = 'Facilities';
const VALID_PASS = 'GoFoods@2026';

async function checkStoredAuth(){
  try{
    const res = await window.storage.get(AUTHKEY, false);
    return !!(res && res.value === 'ok');
  }catch(e){ return false; }
}
async function setStoredAuth(){
  try{ await window.storage.set(AUTHKEY, 'ok', false); }catch(e){ console.error('Falha ao salvar sessão', e); }
}
async function clearStoredAuth(){
  try{ await window.storage.delete(AUTHKEY, false); }catch(e){ /* ignore */ }
}

let loginBound = false;
function showLoginScreen(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  const userInput = document.getElementById('loginUser');
  const passInput = document.getElementById('loginPass');
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if(!loginBound){
    loginBound = true;
    const tryLogin = async ()=>{
      const u = userInput.value.trim();
      const p = passInput.value;
      if(u===VALID_USER && p===VALID_PASS){
        errorEl.style.display = 'none';
        await setStoredAuth();
        await startApp();
      } else {
        errorEl.style.display = 'block';
      }
    };
    btn.addEventListener('click', tryLogin);
    [userInput, passInput].forEach(inp=>inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); }));
  }
  userInput.focus();
}

let eventsBound = false;
async function startApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  if(!eventsBound){ eventsBound = true; bindGlobalEvents(); }
  navigate(currentRole==='admin' ? 'dashboard' : 'colab-home');
}

/* ---------------------------------------------------------------
   BOOTSTRAP
--------------------------------------------------------------- */
async function boot(){
  await initDB();
  const authed = await checkStoredAuth();
  if(authed){ await startApp(); }
  else{ showLoginScreen(); }
}

function bindGlobalEvents(){
  document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await clearStoredAuth();
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginError').style.display = 'none';
    showLoginScreen();
  });
  document.getElementById('notifBtn').addEventListener('click', (e)=>{ e.stopPropagation(); toggleNotifDropdown(); });
  document.addEventListener('click', (e)=>{
    const dd = document.getElementById('notifDropdown');
    if(notifOpen && !dd.contains(e.target)){ notifOpen=false; dd.style.display='none'; }
  });
  document.getElementById('globalSearch').addEventListener('input', (e)=>{
    ordersFilters.q = e.target.value;
    ordersFilters.page = 1;
    if(currentRoute==='pedidos'){
      const fq = document.getElementById('filterQ');
      if(fq) fq.value = e.target.value;
      updatePedidosTable();
    } else {
      navigate('pedidos');
    }
  });
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}
function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  const items = currentRole==='admin' ? NAV_ITEMS : COLAB_NAV_ITEMS;
  const sectionLabel = currentRole==='admin' ? 'GESTÃO' : 'MEU ESPAÇO';
  let html = `<div class="nav-section-label">${sectionLabel}</div>`;
  items.forEach(it=>{
    let badge = '';
    if(it.id==='pedidos'){
      const pend = DB.orders.filter(o=>o.status==='pendente').length;
      if(pend) badge = `<span class="nav-badge">${pend}</span>`;
    }
    if(it.id==='notificacoes'){
      const unread = DB.notifications.filter(n=>!n.read).length;
      if(unread) badge = `<span class="nav-badge">${unread}</span>`;
    }
    html += `<div class="nav-item ${currentRoute===it.id?'active':''}" data-route="${it.id}">
      <span class="nav-ic">${it.icon}</span><span>${it.label}</span>${badge}
    </div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ navigate(el.dataset.route); closeSidebarMobile(); });
  });
}

const ROUTE_TITLES = {
  'dashboard': ['Dashboard','Confira o resumo dos pedidos de lanches.'],
  'novo-pedido': ['Novo Pedido','Registre um novo pedido de lanche.'],
  'pedidos': ['Pedidos','Acompanhe e gerencie todos os pedidos.'],
  'cardapio': ['Cardápio','Gerencie os produtos disponíveis.'],
  'departamentos': ['Departamentos','Gerencie os setores da empresa.'],
  'relatorios': ['Relatórios','Gere relatórios de consumo, custos e desperdício.'],
  'notificacoes': ['Notificações','Acompanhe os avisos do sistema.'],
  'auditoria': ['Histórico e Auditoria','Veja todas as ações realizadas no sistema.'],
  'configuracoes': ['Configurações','Preferências do sistema.'],
  'colab-home': ['Olá! 👋','O que você gostaria de fazer hoje?'],
  'colab-pedir': ['Fazer pedido','Escolha seus lanches favoritos.'],
  'colab-meus': ['Meus pedidos','Acompanhe o status dos seus pedidos.'],
  'colab-cardapio': ['Cardápio','Confira o que está disponível hoje.'],
};

function navigate(route){
  currentRoute = route;
  const [title,sub] = ROUTE_TITLES[route] || ['',''];
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSub').textContent = sub;
  renderSidebar();
  renderView();
  document.getElementById('viewRoot').scrollTo?.(0,0);
  window.scrollTo(0,0);
}

function renderView(){
  const root = document.getElementById('viewRoot');
  const renderers = {
    'dashboard': renderDashboard,
    'novo-pedido': renderNovoPedido,
    'pedidos': renderPedidos,
    'cardapio': renderCardapio,
    'departamentos': renderDepartamentos,
    'relatorios': renderRelatorios,
    'notificacoes': renderNotificacoesView,
    'auditoria': renderAuditoria,
    'configuracoes': renderConfiguracoes,
    'colab-home': renderColabHome,
    'colab-pedir': renderColabPedir,
    'colab-meus': renderColabMeus,
    'colab-cardapio': renderColabCardapio,
  };
  const fn = renderers[currentRoute];
  root.innerHTML = '<div class="view"></div>';
  const container = root.querySelector('.view');
  if(fn) fn(container); else container.innerHTML = '<div class="empty-state"><div class="empty-ic">🚧</div><div class="empty-title">Em construção</div></div>';
}

function toggleNotifDropdown(){
  notifOpen = !notifOpen;
  const dd = document.getElementById('notifDropdown');
  if(!notifOpen){ dd.style.display='none'; return; }
  renderNotifDropdown();
  dd.style.display='block';
}
function renderNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  dd.className = 'notif-dropdown';
  const list = DB.notifications.slice(0,8);
  const NOTIF_ICONS = {novo_pedido:'🥪', pedido_entregue:'🟢', produto_indisponivel:'🚫', estoque_baixo:'📦', pedido_nao_retirado:'⚫'};
  dd.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;">
      <strong style="font-size:13.5px;">Notificações</strong>
      <button class="btn btn-ghost btn-sm" id="markAllReadBtn">Marcar tudo como lido</button>
    </div>
    ${list.length ? list.map(n=>`
      <div class="notif-item ${n.read?'':'unread'}" data-id="${n.id}">
        <div class="notif-ic">${NOTIF_ICONS[n.type]||'🔔'}</div>
        <div>
          <div class="notif-title">${escapeHtml(n.message)}</div>

--------------------------------------------------------------- */
function rangeForFilter(filter, customRange){
  const end = new Date(); end.setHours(23,59,59,999);
  let start = new Date();
  if(filter==='today'){ start.setHours(0,0,0,0); }
  else if(filter==='week'){ start.setDate(start.getDate()-6); start.setHours(0,0,0,0); }
  else if(filter==='month'){ start.setDate(start.getDate()-29); start.setHours(0,0,0,0); }
  else if(filter==='custom' && customRange){ start = new Date(customRange.from+'T00:00:00'); return {start, end:new Date(customRange.to+'T23:59:59')}; }
  return {start, end};
}
function ordersInRange(range){
  return DB.orders.filter(o=>{
    const d = new Date(o.date+'T'+(o.time||'00:00')+':00');
    return d>=range.start && d<=range.end;
  });
}
function previousRange(range){
  const span = range.end - range.start;
  return {start:new Date(range.start.getTime()-span-1), end:new Date(range.start.getTime()-1)};
}

function kpiCard(icon,label,value,trend,color,bg){
  const trendHtml = (trend===null||trend===undefined) ? '' :
    `<span class="kpi-trend ${trend>=0?'up':'down'}">${trend>=0?'↑':'↓'} ${Math.abs(trend)}%</span>`;
  return `<div class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-ic" style="background:${bg};color:${color};">${icon}</div>
      ${trendHtml}
    </div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${label}</div>
  </div>`;
}
function execTile(label,value,trend){
  const trendHtml = (trend===null||trend===undefined) ? '' :
    `<div class="kpi-trend ${trend>=0?'up':'down'}" style="display:inline-flex;margin-top:8px;">${trend>=0?'↑':'↓'} ${Math.abs(trend)}% vs. período anterior</div>`;
  return `<div class="kpi-card" style="box-shadow:none;">
    <div class="kpi-value" style="font-size:20px;">${value}</div>
    <div class="kpi-label">${label}</div>
    ${trendHtml}
  </div>`;
}
function topProductName(orders){
  const counts = {};
  orders.forEach(o=>o.items.forEach(it=>{ counts[it.name]=(counts[it.name]||0)+it.qty; }));
  const arr = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return arr.length ? arr[0][0] : '—';
}
function topDeptName(orders){
  const counts = {};
  orders.forEach(o=>{ counts[o.department]=(counts[o.department]||0)+1; });
  const arr = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return arr.length ? departmentName(arr[0][0]) : '—';
}

function buildRankProducts(orders){

function filteredOrders(){

      const q = ordersFilters.q.toLowerCase();
      if(!(o.employeeName.toLowerCase().includes(q) || o.id.toLowerCase().includes(q))) return false;
    }
    if(ordersFilters.dept && o.department!==ordersFilters.dept) return false;
    if(ordersFilters.status && o.status!==ordersFilters.status) return false;
    if(ordersFilters.product && !o.items.some(it=>it.productId===ordersFilters.product)) return false;
    if(ordersFilters.from && o.date < ordersFilters.from) return false;
    if(ordersFilters.to && o.date > ordersFilters.to) return false;
    return true;
  }).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
}

  document.getElementById('filterStatus').addEventListener('change', e=>{ ordersFilters.status=e.target.value; ordersFilters.page=1; updatePedidosTable(); });
  document.getElementById('filterProduct').addEventListener('change', e=>{ ordersFilters.product=e.target.value; ordersFilters.page=1; updatePedidosTable(); });
  document.getElementById('filterFrom').addEventListener('change', e=>{ ordersFilters.from=e.target.value; ordersFilters.page=1; updatePedidosTable(); });
  document.getElementById('filterTo').addEventListener('change', e=>{ ordersFilters.to=e.target.value; ordersFilters.page=1; updatePedidosTable(); });

    const gs = document.getElementById('globalSearch'); if(gs) gs.value='';

function updatePedidosTable(){
  const container = document.getElementById('pedidosTableContainer');
  if(!container) return;
  const all = filteredOrders();
  const totalPages = Math.max(1, Math.ceil(all.length/PAGE_SIZE));
  ordersFilters.page = Math.min(ordersFilters.page, totalPages);
  const pageItems = all.slice((ordersFilters.page-1)*PAGE_SIZE, ordersFilters.page*PAGE_SIZE);

  const sub = document.getElementById('pedidosCountSub');
  if(sub) sub.textContent = `${all.length} pedido(s) encontrado(s)`;

  container.innerHTML = `
    <div class="table-wrap">
      ${pageItems.length ? `
      <table class="data-table">
        <thead><tr>
          <th>Pedido</th><th>Colaborador</th><th>Departamento</th><th>Lanche</th><th>Data</th><th>Horário</th><th>Valor</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${pageItems.map(o=>`
            <tr data-id="${o.id}">
              <td class="cell-id">${o.id}</td>
              <td class="cell-strong">${escapeHtml(o.employeeName)}</td>
              <td>${escapeHtml(departmentName(o.department))}</td>
              <td>${escapeHtml(o.items.map(i=>i.qty+'x '+i.name).join(', '))}</td>
              <td>${fmtDate(o.date)}<div class="cell-sub">${o.time}</div></td>
              <td>${o.time}</td>
              <td class="cell-strong">${fmtBRL(o.total)}</td>
              <td>
                <select class="status-select" data-order="${o.id}" onclick="event.stopPropagation();">
                  ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v.emoji} ${v.label}</option>`).join('')}
                </select>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="pagination">
        ${Array.from({length:totalPages},(_,i)=>`<button class="pg-btn ${ordersFilters.page===i+1?'active':''}" data-pg="${i+1}">${i+1}</button>`).join('')}
      </div>
      ` : emptyState('📭','Nenhum pedido encontrado','Tente ajustar os filtros ou registre um novo pedido.') }
    </div>
  `;

  container.querySelectorAll('.pg-btn').forEach(b=>b.addEventListener('click', ()=>{ ordersFilters.page=parseInt(b.dataset.pg); updatePedidosTable(); }));
  container.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>openOrderModal(tr.dataset.id));
  });
  container.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const orderId = sel.dataset.order;
      const newStatus = sel.value;
      if(newStatus==='cancelado'){
        confirmDialog('Cancelar pedido?', `Tem certeza que deseja cancelar o pedido ${orderId}? Essa ação não pode ser desfeita.`, ()=>{
          changeOrderStatus(orderId, newStatus);
          updatePedidosTable();
          renderSidebar();
        });
        // se o usuário desistir, volta o select para o status atual
        const o = DB.orders.find(x=>x.id===orderId);
        if(o) sel.value = o.status;
      } else {
        changeOrderStatus(orderId, newStatus);
        updatePedidosTable();
        renderSidebar();
      }
    });
  });
}

function restoreStockForOrder(o){
  o.items.forEach(it=>{
    const p = productById(it.productId);
    if(p) p.stock += it.qty;
  });
}
function validateCartAgainstStock(items){
  for(const it of items){
    const p = productById(it.productId);
    if(!p || !p.available) return `"${it.name}" não está mais disponível.`;
    if(it.qty > p.stock) return `Estoque insuficiente para "${it.name}". Disponível: ${p.stock}.`;
  }
  return null;
}
const LOW_STOCK_THRESHOLD = 5;
function commitStockForItems(items){
  items.forEach(it=>{
    const p = productById(it.productId);
    if(!p) return;
    p.stock = Math.max(0, p.stock - it.qty);
    if(p.stock===0) pushNotification('estoque_baixo', `"${p.name}" está esgotado.`);
    else if(p.stock<=LOW_STOCK_THRESHOLD) pushNotification('estoque_baixo', `Estoque baixo de "${p.name}": ${p.stock} unidade(s) restante(s).`);
  });
}

function changeOrderStatus(orderId, newStatus, actor){
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o || o.status===newStatus) return;
  const oldLabel = STATUS_META[o.status].label;
  if(newStatus==='cancelado' && o.status!=='cancelado') restoreStockForOrder(o);
  o.status = newStatus;
  o.statusHistory.push({status:newStatus, timestamp:new Date().toISOString(), user: actor||'Facilities'});
  pushAudit(`alterou o pedido ${o.id} de "${oldLabel}" para "${STATUS_META[newStatus].label}"`, o.id);
  if(newStatus==='entregue') pushNotification('pedido_entregue', `Pedido ${o.id} foi entregue`);
  if(newStatus==='nao_retirado') pushNotification('pedido_nao_retirado', `Pedido ${o.id} não foi retirado`);
  storageSave();
  toast(`Pedido ${o.id} atualizado para "${STATUS_META[newStatus].label}"`, 'success');
}

function openModal(html, opts){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `<div class="modal-box ${opts&&opts.wide?'wide':''}">${html}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){
  const m = document.getElementById('activeModal');
  if(m) m.remove();
}

function openOrderModal(orderId){
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o) return;
  const flowIdx = STATUS_FLOW.indexOf(o.status);
  const isTerminalOther = ['cancelado','nao_retirado'].includes(o.status);
  const overlay = openModal(`
    <div class="modal-head">
      <h3>Pedido ${o.id}</h3>
      <button class="modal-close" id="closeOrderModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid" style="margin-bottom:18px;">

        <div><div class="cell-sub">Horário</div><div class="cell-strong">${o.time}</div></div>
      </div>

      ${isTerminalOther ? `<div class="badge badge-${STATUS_META[o.status].cls}" style="margin-bottom:16px;"><span class="dot"></span>${STATUS_META[o.status].label}</div>` : `
      <div class="timeline">
        ${STATUS_FLOW.map((s,i)=>{
          const done = i<flowIdx || (i===flowIdx);
          const doneCls = i<flowIdx ? 'done' : (i===flowIdx ? 'current' : '');
          const hist = o.statusHistory.find(h=>h.status===s);
          return `<div class="tl-step ${doneCls}">
            <div class="tl-dot">${i<flowIdx?'✓':STATUS_META[s].emoji}</div>
            <div class="tl-label">${STATUS_META[s].label}</div>
            <div class="tl-time">${hist?fmtDateTime(hist.timestamp).split(' às ')[1]:''}</div>
          </div>`;
        }).join('')}
      </div>`}

      <div class="order-items-box" style="margin-bottom:16px;">
        ${o.items.map(it=>`<div class="order-line"><span>${it.qty}x ${escapeHtml(it.name)}</span><span>${fmtBRL(it.price*it.qty)}</span></div>`).join('')}
        <div class="order-total-row"><span>Total</span><span>${fmtBRL(o.total)}</span></div>
      </div>

      ${o.observations ? `<div style="margin-bottom:14px;"><div class="cell-sub">Observações</div><div>${escapeHtml(o.observations)}</div></div>` : ''}

    </div>
    <div class="modal-foot">
      ${!isTerminalOther && o.status!=='entregue' ? `<button class="btn btn-danger" id="cancelOrderBtn">Cancelar pedido</button>` : ''}
      ${!isTerminalOther ? `<button class="btn btn-primary" id="advanceOrderBtn">${flowIdx<STATUS_FLOW.length-1 ? 'Avançar para "'+STATUS_META[STATUS_FLOW[flowIdx+1]].label+'"' : 'Concluído'}</button>` : ''}
    </div>
  `, {wide:true});

  document.getElementById('closeOrderModal').addEventListener('click', closeModal);
  const advBtn = document.getElementById('advanceOrderBtn');
  if(advBtn) advBtn.addEventListener('click', ()=>{
    if(flowIdx<STATUS_FLOW.length-1){
      changeOrderStatus(o.id, STATUS_FLOW[flowIdx+1]);
      closeModal(); openOrderModal(o.id); renderSidebar();
      if(currentRoute==='pedidos') updatePedidosTable();
    }
  });
  const cancelBtn = document.getElementById('cancelOrderBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    confirmDialog('Cancelar pedido?', `Tem certeza que deseja cancelar o pedido ${o.id}? Essa ação não pode ser desfeita.`, ()=>{
      changeOrderStatus(o.id, 'cancelado');
      closeModal();
      if(currentRoute==='pedidos') updatePedidosTable();
      renderSidebar();
    });
  });
}

let reportFilter = {group:'periodo', range:'month', from:'', to:''};
function renderRelatorios(root){

    ? {start:new Date(reportFilter.from+'T00:00:00'), end:new Date(reportFilter.to+'T23:59:59')}
    : rangeForFilter(reportFilter.range==='custom'?'month':reportFilter.range);
  const orders = ordersInRange(range);
  const valid = orders.filter(o=>o.status!=='cancelado');
  const totalItems = valid.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0);
  const days = Math.max(1, Math.round((range.end-range.start)/86400000));
  const uniqueEmp = new Set(valid.map(o=>o.employeeId)).size;
  const notPicked = orders.filter(o=>o.status==='nao_retirado');
  const wasteValue = notPicked.reduce((s,o)=>s+o.total,0);

  const byDept = {};
  valid.forEach(o=>{ byDept[o.department] = (byDept[o.department]||0)+o.total; });
  const byProduct = {};
  valid.forEach(o=>o.items.forEach(it=>{ byProduct[it.name]=(byProduct[it.name]||{qty:0,value:0}); byProduct[it.name].qty+=it.qty; byProduct[it.name].value+=it.price*it.qty; }));
  const byEmployee = {};
  valid.forEach(o=>{ byEmployee[o.employeeId]=(byEmployee[o.employeeId]||{name:o.employeeName,count:0,value:0}); byEmployee[o.employeeId].count++; byEmployee[o.employeeId].value+=o.total; });
  const topEmployees = Object.values(byEmployee).sort((a,b)=>b.count-a.count).slice(0,8);
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);

  root.innerHTML = `
    <div class="view-head"><div><h2>Relatórios</h2><div class="view-sub">Consumo, custos e desperdício por período.</div></div></div>
    <div class="toolbar">
      <div class="pill-group">
        <button data-r="today" class="${reportFilter.range==='today'?'active':''}">Dia</button>
        <button data-r="week" class="${reportFilter.range==='week'?'active':''}">Semana</button>
        <button data-r="month" class="${reportFilter.range==='month'?'active':''}">Mês</button>
        <button data-r="custom" class="${reportFilter.range==='custom'?'active':''}">Personalizado</button>
      </div>
      ${reportFilter.range==='custom' ? `
        <div class="field-inline"><span>De</span><input type="date" id="repFrom" value="${reportFilter.from||daysAgoStr(30)}"></div>
        <div class="field-inline"><span>Até</span><input type="date" id="repTo" value="${reportFilter.to||todayStr()}"></div>
        <button class="btn btn-primary btn-sm" id="repApply">Aplicar</button>
      ` : ''}
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><h3>Relatório de consumo</h3></div>
      <div class="kpi-grid" style="margin-bottom:0;">
        ${execTile('Total de pedidos', valid.length)}
        ${execTile('Total de itens', totalItems)}
        ${execTile('Produto mais pedido', topProducts.length?topProducts[0][0]:'—')}
        ${execTile('Média de pedidos/dia', (valid.length/days).toFixed(1))}
        ${execTile('Média de pedidos/colaborador', uniqueEmp? (valid.length/uniqueEmp).toFixed(1) : '0')}
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><h3>Relatório financeiro</h3></div>
      <div class="kpi-grid" style="margin-bottom:0;">
        ${execTile('Total gasto', fmtBRL(valid.reduce((s,o)=>s+o.total,0)))}
        ${execTile('Gasto médio/pedido', fmtBRL(valid.length? valid.reduce((s,o)=>s+o.total,0)/valid.length : 0))}
        ${execTile('Depto. maior gasto', Object.keys(byDept).length ? departmentName(Object.entries(byDept).sort((a,b)=>b[1]-a[1])[0][0]) : '—')}
        ${execTile('Produto maior gasto', topProducts.length ? [...topProducts].sort((a,b)=>b[1].value-a[1].value)[0][0] : '—')}
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><h3>Relatório de desperdício</h3></div>
      <div class="kpi-grid" style="margin-bottom:0;">
        ${execTile('Pedidos não retirados', notPicked.length)}
        ${execTile('Valor estimado do desperdício', fmtBRL(wasteValue))}
        ${execTile('Taxa de desperdício', pct(notPicked.length, orders.length)+'%')}
      </div>
    </div>

    <div class="charts-grid">
      <div class="panel">
        <div class="panel-head"><h3>Colaboradores que mais pedem</h3></div>
        <div class="rank-list">
          ${topEmployees.length ? topEmployees.map((e,i)=>`
            <div class="rank-row"><div class="rank-num">${i+1}</div>
              <div class="rank-info"><div class="r-name">${escapeHtml(e.name)}</div>
              <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct(e.count, topEmployees[0].count)}%;"></div></div></div>
              <div class="rank-count">${e.count}x</div></div>
          `).join('') : emptyState('👥','Sem dados','Nenhum pedido no período.')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Produtos mais pedidos</h3></div>
        <div class="rank-list">
          ${topProducts.length ? topProducts.map(([name,v],i)=>`
            <div class="rank-row"><div class="rank-num">${i+1}</div>
              <div class="rank-info"><div class="r-name">${escapeHtml(name)}</div>
              <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct(v.qty, topProducts[0][1].qty)}%;"></div></div></div>
              <div class="rank-count">${v.qty}x</div></div>
          `).join('') : emptyState('🍽️','Sem dados','Nenhum pedido no período.')}
        </div>
      </div>
    </div>
  `;

  root.querySelectorAll('.pill-group button').forEach(b=>b.addEventListener('click', ()=>{ reportFilter.range=b.dataset.r; renderView(); }));
  const applyBtn = document.getElementById('repApply');
  if(applyBtn) applyBtn.addEventListener('click', ()=>{
    reportFilter.from=document.getElementById('repFrom').value; reportFilter.to=document.getElementById('repTo').value; renderView();
  });
}
function exportOrdersCsv(orders, asExcel){
  const rows = [['Pedido','Colaborador','Departamento','Data','Horário','Itens','Total','Status']];
  orders.forEach(o=>rows.push([o.id,o.employeeName,departmentName(o.department),o.date,o.time,o.items.map(i=>i.qty+'x '+i.name).join(' | '),o.total.toFixed(2),STATUS_META[o.status].label]));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `relatorio-gofoods${asExcel?'.xls':'.csv'}`;
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Relatório exportado (${asExcel?'Excel':'CSV'}).`,'success');
}

function downloadBackup(){

  const blob = new Blob([json], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  URL.revokeObjectURL(url);
  toast('Backup gerado com sucesso.','success');

let colabCart = [];
function renderColabPedir(root){
  if(!colabIdentity){ renderColabOnboarding(root); return; }
  const available = DB.products.filter(p=>p.available && p.stock>0);
  root.innerHTML = `
    <div class="view-head"><div><h2>Fazer pedido</h2><div class="view-sub">Escolha seus lanches favoritos.</div></div></div>
    ${available.length ? `<div class="card-grid" style="margin-bottom:20px;">
      ${available.map(p=>`
        <div class="prod-card">
          <span class="prod-cat">${p.category}</span>
          <div class="prod-name">${escapeHtml(p.name)}</div>
          <div class="prod-desc">${escapeHtml(p.description||'')}</div>
          <div class="prod-foot"><div class="prod-price">${fmtBRL(p.price)}</div></div>
          <div class="prod-actions"><button class="btn btn-primary btn-sm" data-add="${p.id}" style="flex:1;">+ Adicionar</button></div>
        </div>`).join('')}
    </div>` : emptyState('🍽️','Nenhum item disponível no momento','Peça para um administrador cadastrar produtos no Cardápio.')}
    <div class="panel" style="max-width:480px;">
      <div class="panel-head"><h3>Meu carrinho</h3></div>
      <div class="order-items-box" id="colabCartBox"></div>
      <div class="form-field full" style="margin-top:14px;"><label>Observações</label><textarea id="colabObs" placeholder="Ex: sem cebola"></textarea></div>
      <button class="btn btn-primary" id="colabConfirmBtn" style="width:100%;margin-top:14px;">Confirmar pedido</button>
    </div>
  `;
  root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=>{
    const p = productById(b.dataset.add);
    if(!p || !p.available){ toast('Este item não está mais disponível.','error'); return; }
    const ex = colabCart.find(i=>i.productId===p.id);
    const alreadyInCart = ex ? ex.qty : 0;
    if(alreadyInCart + 1 > p.stock){ toast(`Estoque insuficiente para "${p.name}".`,'error'); return; }
    if(ex) ex.qty++; else colabCart.push({productId:p.id, name:p.name, price:p.price, qty:1});
    renderColabCart();
    toast(`${p.name} adicionado ao carrinho.`,'success');
  }));
  renderColabCart();
  document.getElementById('colabConfirmBtn').addEventListener('click', ()=>{
    if(!colabCart.length){ toast('Adicione ao menos um item.','error'); return; }
    const stockError = validateCartAgainstStock(colabCart);
    if(stockError){ toast(stockError,'error'); return; }
    const total = colabCart.reduce((s,i)=>s+i.price*i.qty,0);
    const order = {
      id:uid('PED-'), employeeId:colabIdentity.name, employeeName:colabIdentity.name, department:colabIdentity.department,
      date:todayStr(), time:new Date().toTimeString().slice(0,5),
      items: JSON.parse(JSON.stringify(colabCart)), total,
      observations: document.getElementById('colabObs').value.trim(),
      paymentMethod:'Benefício empresa', status:'pendente',
      statusHistory:[{status:'pendente', timestamp:new Date().toISOString(), user:colabIdentity.name}],
      createdAt:new Date().toISOString(),
    };
    commitStockForItems(colabCart);
    DB.orders.unshift(order);
    pushNotification('novo_pedido', `Novo pedido realizado por ${colabIdentity.name}`);
    pushAudit(`registrou o pedido ${order.id} para ${colabIdentity.name}`, order.id);
    storageSave();
    colabCart = [];
    toast('Pedido registrado com sucesso!','success');
    navigate('colab-meus');
  });
}
function renderColabCart(){
  const box = document.getElementById('colabCartBox');
  if(!box) return;
  if(!colabCart.length){ box.innerHTML = `<div style="text-align:center;color:var(--ink-faint);font-size:12.5px;padding:10px;">Seu carrinho está vazio.</div>`; return; }
  const total = colabCart.reduce((s,i)=>s+i.price*i.qty,0);
  box.innerHTML = colabCart.map((it,idx)=>`
    <div class="order-line"><span>${it.qty}x ${escapeHtml(it.name)}</span>
      <span class="row" style="gap:10px;"><span>${fmtBRL(it.price*it.qty)}</span><button type="button" class="btn btn-ghost btn-sm" data-rm="${idx}" style="padding:4px 8px;">✕</button></span></div>
  `).join('') + `<div class="order-total-row"><span>Total</span><span>${fmtBRL(total)}</span></div>`;
  box.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ colabCart.splice(parseInt(b.dataset.rm),1); renderColabCart(); }));
}

function renderColabMeus(root){
  if(!colabIdentity){ renderColabOnboarding(root); return; }
  const orders = DB.orders.filter(o=>o.employeeId===colabIdentity.name).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  root.innerHTML = `
    <div class="view-head"><div><h2>Meus pedidos</h2><div class="view-sub">Acompanhe o status dos seus pedidos em tempo real.</div></div></div>

  `;
}
